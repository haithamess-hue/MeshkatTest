      <div class="container container-narrow">
        <h2 class="section-title" data-i18n="forms.title"></h2>
        <p class="section-sub" data-i18n="forms.subtitle"></p>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-company" aria-controls="panel-company" aria-selected="true" data-i18n="forms.tabCompany"></button>
          <button type="button" role="tab" id="tab-talent" aria-controls="panel-talent" aria-selected="false" tabindex="-1" data-i18n="forms.tabTalent"></button>
        </div>

        <!-- 5.1 Company form -->
        <div class="panel" role="tabpanel" id="panel-company" aria-labelledby="tab-company" tabindex="-1">
          <form class="form" id="form-company" data-form-type="company" novalidate>
            <p class="req-note" data-i18n="forms.requiredNote"></p>
            <div class="hp" aria-hidden="true"><label for="c-hp">Website URL</label><input id="c-hp" name="website_url" type="text" tabindex="-1" autocomplete="off"></div>

            <div class="grid-2">
              <div class="field">
                <label for="c-fullName"><span data-i18n="forms.company.fullName"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="c-fullName" name="fullName" type="text" autocomplete="name" required>
                <p class="field-error" id="c-fullName-err"></p>
              </div>
              <div class="field">
                <label for="c-email"><span data-i18n="forms.company.email"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="c-email" name="email" type="email" autocomplete="email" inputmode="email" dir="ltr" required data-validate="email">
                <p class="field-error" id="c-email-err"></p>
              </div>
              <div class="field">
                <label for="c-companyName"><span data-i18n="forms.company.companyName"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="c-companyName" name="companyName" type="text" autocomplete="organization" required>
                <p class="field-error" id="c-companyName-err"></p>
              </div>
              <div class="field">
                <label for="c-companyWebsite"><span data-i18n="forms.company.companyWebsite"></span> <span class="opt">(<span data-i18n="forms.optional"></span>)</span></label>
                <input id="c-companyWebsite" name="companyWebsite" type="url" inputmode="url" autocomplete="url" dir="ltr" data-validate="url">
                <p class="field-error" id="c-companyWebsite-err"></p>
              </div>
              <div class="field">
                <label for="c-roleTitle"><span data-i18n="forms.company.roleTitle"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="c-roleTitle" name="roleTitle" type="text" required>
                <p class="field-error" id="c-roleTitle-err"></p>
              </div>
              <div class="field">
                <label for="c-roleType"><span data-i18n="forms.company.roleType"></span><span class="req" aria-hidden="true">*</span></label>
                <select id="c-roleType" name="roleType" required data-options="options.roleTypes"></select>
                <p class="field-error" id="c-roleType-err"></p>
              </div>
              <div class="field">
                <label for="c-level"><span data-i18n="forms.company.level"></span><span class="req" aria-hidden="true">*</span></label>
                <select id="c-level" name="level" required data-options="options.levels"></select>
                <p class="field-error" id="c-level-err"></p>
              </div>
              <div class="field">
                <label for="c-workSetup"><span data-i18n="forms.company.workSetup"></span><span class="req" aria-hidden="true">*</span></label>
                <select id="c-workSetup" name="workSetup" required data-options="options.workSetup"></select>
                <p class="field-error" id="c-workSetup-err"></p>
              </div>
              <div class="field">
                <label for="c-location"><span data-i18n="forms.company.location"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="c-location" name="location" type="text" autocomplete="address-level2" required>
                <p class="field-error" id="c-location-err"></p>
              </div>
              <div class="field">
                <label for="c-salaryRange"><span data-i18n="forms.company.salaryRange"></span> <span class="opt">(<span data-i18n="forms.optional"></span>)</span></label>
                <input id="c-salaryRange" name="salaryRange" type="text" data-i18n-attr="placeholder:forms.company.salaryHint">

            <div class="field">

            <button type="submit" class="btn btn-primary btn-lg btn-block" data-i18n="forms.company.submit" data-label="forms.company.submit"></button>

          <div class="success" hidden tabindex="-1" role="status">

        <!-- 5.2 Talent form -->
        <div class="panel" role="tabpanel" id="panel-talent" aria-labelledby="tab-talent" tabindex="-1" hidden>

            <p class="req-note" data-i18n="forms.requiredNote"></p>
            <div class="hp" aria-hidden="true"><label for="t-hp">Website URL</label><input id="t-hp" name="website_url" type="text" tabindex="-1" autocomplete="off"></div>

            <div class="grid-2">
              <div class="field">
                <label for="t-fullName"><span data-i18n="forms.talent.fullName"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="t-fullName" name="fullName" type="text" autocomplete="name" required>
                <p class="field-error" id="t-fullName-err"></p>
              </div>
              <div class="field">
                <label for="t-email"><span data-i18n="forms.talent.email"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="t-email" name="email" type="email" autocomplete="email" inputmode="email" dir="ltr" required data-validate="email">
                <p class="field-error" id="t-email-err"></p>
              </div>
              <div class="field">
                <label for="t-linkedin"><span data-i18n="forms.talent.linkedin"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="t-linkedin" name="linkedin" type="url" inputmode="url" dir="ltr" required data-validate="url" data-i18n-attr="placeholder:forms.talent.linkedinHint">
                <p class="field-error" id="t-linkedin-err"></p>
              </div>
              <div class="field">
                <label for="t-currentRole"><span data-i18n="forms.talent.currentRole"></span><span class="req" aria-hidden="true">*</span></label>
                <select id="t-currentRole" name="currentRole" required data-options="options.roleTypes"></select>
                <p class="field-error" id="t-currentRole-err"></p>
              </div>
              <div class="field">
                <label for="t-experience"><span data-i18n="forms.talent.experience"></span><span class="req" aria-hidden="true">*</span></label>
                <select id="t-experience" name="experience" required data-options="options.experience"></select>

              </div>
              <div class="field">
                <label for="t-country"><span data-i18n="forms.talent.country"></span><span class="req" aria-hidden="true">*</span></label>
                <input id="t-country" name="country" type="text" autocomplete="country-name" required>
                <p class="field-error" id="t-country-err"></p>
              </div>
            </div>
            <fieldset class="field" id="t-openTo" data-required-group="openTo" data-checks="options.openTo">

              <p class="field-error" id="t-openTo-err"></p>

              <label for="t-portfolio"><span data-i18n="forms.talent.portfolio"></span> <span class="opt">(<span data-i18n="forms.optional"></span>)</span></label>
              <input id="t-portfolio" name="portfolio" type="url" inputmode="url" dir="ltr" data-validate="url">
              <p class="field-error" id="t-portfolio-err"></p>
            </div>
            <div class="field">
              <label for="t-notes"><span data-i18n="forms.talent.notes"></span> <span class="opt">(<span data-i18n="forms.optional"></span>)</span></label>
              <textarea id="t-notes" name="notes" rows="4"></textarea>
            </div>

            <p class="form-status" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-lg btn-block" data-i18n="forms.talent.submit" data-label="forms.talent.submit"></button>
          </form>
          <div class="success" hidden tabindex="-1" role="status">
            <svg class="icon icon-xl" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>
            <p data-i18n="forms.talent.success"></p>
          </div>
        </div>
